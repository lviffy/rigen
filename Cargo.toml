[package]
name = "rice-gen"
version = "0.1.0"
edition = "2021"
authors = ["lviffy"]
description = "AI-powered palette-locked wallpaper generator for Hyprland"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
viuer = "0.7"
dirs = "6"
rand = "0.9"
colored = "3"
which = "7"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
