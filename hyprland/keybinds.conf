# rice-gen Hyprland keybindings snippet
# Drop into ~/.config/hypr/custom/keybinds.conf or include in hyprland.conf

# 1. Lucky wallpaper: generate and apply in background with desktop notification
bindd = Super+Shift, W, Generate AI wallpaper, exec, rice-gen --lucky --notify --quiet

# 2. Interactive prompt: opens floating Kitty terminal with inline preview & confirmation
bindd = Super+Alt, W, Prompt AI wallpaper, exec, kitty --class rice-gen -e bash -c 'read -p "Enter Wallpaper Prompt: " p && rice-gen "$p" -p'

# 3. Save active wallpaper to collection
bindd = Super+Ctrl, W, Save current wallpaper, exec, rice-gen save

